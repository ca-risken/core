syntax = "proto3";

package core.ai;
option go_package = "github.com/ca-risken/core/proto/ai";

import "ai/entity.proto";
import "validate/validate.proto";

service AIService {
  rpc ChatAI(ChatAIRequest) returns (ChatAIResponse);
  rpc GenerateReport(GenerateReportRequest) returns (GenerateReportResponse);
  rpc CreateRemediationProposal(CreateRemediationProposalRequest)
      returns (CreateRemediationProposalResponse);
  rpc UpdateRemediationProposalStatus(UpdateRemediationProposalStatusRequest)
      returns (UpdateRemediationProposalStatusResponse);
}

message ChatAIRequest {
  string question = 1 [ (validate.rules).string.min_len = 1 ]; // Required
  repeated ChatHistory chat_history = 2;
  uint32 project_id = 3;
}

message ChatAIResponse { string answer = 1; }

message GenerateReportRequest {
  string prompt = 1 [ (validate.rules).string.min_len = 1 ]; // Required
  uint32 project_id = 2 [ (validate.rules).uint32.gt = 0 ];  // Required
  string name = 3 [ (validate.rules).string.min_len = 1 ];   // Required
}

message GenerateReportResponse {
  uint32 report_id = 1;
  string status = 2;
}

message CreateRemediationProposalRequest {
  uint32 project_id = 1 [ (validate.rules).uint32.gt = 0 ]; // Required
  uint64 finding_id = 2 [ (validate.rules).uint64.gt = 0 ]; // Required
}

message CreateRemediationProposalResponse {
  RemediationProposal remediation_proposal = 1;
}

message UpdateRemediationProposalStatusRequest {
  uint32 project_id = 1 [ (validate.rules).uint32.gt = 0 ]; // Required
  uint32 remediation_proposal_id = 2
      [ (validate.rules).uint32.gt = 0 ]; // Required
  string status = 3 [
    (validate.rules).string = {in : [ "SUCCEEDED", "FAILED" ]}
  ]; // Required
  string status_detail = 4;
  string remediation_plan = 5;
  int64 generated_at = 6;
}

message UpdateRemediationProposalStatusResponse {
  RemediationProposal remediation_proposal = 1;
}
