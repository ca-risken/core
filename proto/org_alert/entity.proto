syntax = "proto3";

package core.org_alert;
option go_package = "github.com/ca-risken/core/proto/org_alert";

// OrgNotification
message OrgNotification {
  uint32 notification_id = 1;
  string name = 2;
  uint32 organization_id = 3;
  string type = 4;
  string notify_setting = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

// OrgAlertCondNotification
message OrgAlertCondNotification {
  uint32 organization_id = 1;
  uint32 project_id = 2;
  uint32 alert_condition_id = 3;
  uint32 notification_id = 4;
  uint32 cache_second = 5;
  int64 notified_at = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  bool enabled = 9;
}
